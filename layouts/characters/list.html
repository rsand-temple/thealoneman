{{ define "main" }}
<section class="character-index">
  <header class="character-index-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div>{{ . }}</div>{{ end }}
  </header>

  <div class="character-grid">
    {{ range .Pages.ByWeight }}
      <a class="character-card" href="{{ .RelPermalink }}">
        {{ with .Params.photo }}
          <img src="{{ . }}" alt="{{ $.Title }}">
        {{ end }}
        <div class="character-card-body">
          <h2>{{ .Title }}</h2>
          {{ with .Params.occupation }}<p>{{ . }}</p>{{ end }}
        </div>
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
