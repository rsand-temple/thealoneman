{{ define "main" }}
<article class="about-page">
  <header class="about-header">
    <h1>{{ .Title }}</h1>
  </header>

  <section class="about-dossier">
    {{ with .Params.photo }}
      <div class="about-photo">
        <img src="{{ . }}" alt="{{ $.Title }}">
      </div>
    {{ end }}

    <div class="about-content">
      {{ .Content }}
    </div>
  </section>
</article>
{{ end }}
